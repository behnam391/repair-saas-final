apply plugin: 'com.android.application'

// Release credentials stay outside git. Android Studio can still sign through
// its UI; CI/local automation may provide these environment variables.
def releaseKeystorePath = System.getenv('PEYVO_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('PEYVO_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('PEYVO_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PEYVO_KEY_PASSWORD') ?: releaseKeystorePassword

android {
    namespace = "com.peyvo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.peyvo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.3.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "store"
    productFlavors {
        bazaar {
            dimension "store"
            manifestPlaceholders = [
                marketApplicationId: "com.farsitel.bazaar",
                marketBindAddress: "ir.cafebazaar.pardakht.InAppBillingService.BIND",
                marketPermission: "com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR"
            ]
            buildConfigField "String", "STORE_ID", '"bazaar"'
            buildConfigField "String", "MARKET_PACKAGE", '"com.farsitel.bazaar"'
        }
        myket {
            dimension "store"
            manifestPlaceholders = [
                marketApplicationId: "ir.mservices.market",
                marketBindAddress: "ir.mservices.market.InAppBillingService.BIND",
                marketPermission: "ir.mservices.market.BILLING"
            ]
            buildConfigField "String", "STORE_ID", '"myket"'
            buildConfigField "String", "MARKET_PACKAGE", '"ir.mservices.market"'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.github.myketstore:myket-billing-client:1.19'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
