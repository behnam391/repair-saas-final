<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Peyvo</title>
<style>
  html, body { margin: 0; height: 100%; background: #10121A; }
  body {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-family: Tahoma, "Segoe UI", sans-serif; color: #F1F2F6; text-align: center; padding: 24px;
  }
  .rings { margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 800; }
  p { font-size: 13px; color: #8A90A3; max-width: 320px; line-height: 1.8; margin: 0; }
  button { margin-top: 18px; border: 0; border-radius: 12px; padding: 11px 22px; background: #35C9A5; color: #07130f; font: 700 13px Tahoma, sans-serif; cursor: pointer; }
  small { margin-top: 12px; color: #687083; font-size: 10px; }
</style>
</head>
<body>
  <svg class="rings" width="64" height="64" viewBox="0 0 64 64">
    <rect x="1" y="1" width="62" height="62" rx="16" fill="#14161B" stroke="#2B2F3D"/>
    <circle cx="24" cy="32" r="13" fill="none" stroke="#E08A3E" stroke-width="7"/>
    <circle cx="40" cy="32" r="13" fill="none" stroke="#35C9A5" stroke-width="7"/>
  </svg>
  <h1>Peyvo</h1>
  <p>
    اتصال به پیوو برقرار نشد. اینترنت خود را بررسی کنید؛ برنامه به‌صورت خودکار دوباره تلاش می‌کند.
  </p>
  <button type="button" id="retry">تلاش دوباره</button>
  <small id="status">تلاش مجدد تا چند لحظه دیگر…</small>
  <script>
    const target = "https://peyvo.ir/login";
    const retry = () => {
      document.getElementById("status").textContent = "در حال اتصال…";
      window.location.replace(target);
    };
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
    setTimeout(retry, 8000);
  </script>
</body>
</html>
